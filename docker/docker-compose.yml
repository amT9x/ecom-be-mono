version: "3.9"
name: ecom-mono
services:
  api:
    image: ecom-mono
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3002:3001"
    env_file:
      - ../.env.docker
    networks:
      - ecom-network
    restart: unless-stopped

networks:
  ecom-network:
    external: true
