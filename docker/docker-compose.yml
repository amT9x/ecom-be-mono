version: "3.9"
name: ecom-mono
services:
  api:
    image: ecom-mono
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: development
      APP_NAME: ecom-mono
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
    restart: unless-stopped
