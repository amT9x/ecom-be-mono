version: '3.9'
name: ecom-mono
services:
  api:
    image: ecom-mono
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ../.env
    environment:
      - DB_HOST=postgres
    networks:
      - ecom-network
    restart: unless-stopped

networks:
  ecom-network:
    external: true
