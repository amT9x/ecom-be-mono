name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            --target production \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }}

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }}

            docker stop ecommerce-api || true
            docker rm ecommerce-api || true

            docker run -d \
              --name ecommerce-api \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:${{ github.sha }}
